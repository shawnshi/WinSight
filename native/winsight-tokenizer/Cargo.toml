[package]
name = "winsight-tokenizer"
version = "0.1.0"
edition = "2021"
publish = false
license = "Apache-2.0"

[lib]
name = "winsight_tokenizer"
crate-type = ["cdylib", "rlib"]

[dependencies]
# Official v0.23.3 tag contains Rust crate 0.23.2; pin source, not a nonexistent 0.23.3 crate.
tokenizers = { git = "https://github.com/huggingface/tokenizers.git", rev = "301277072263fb3830eb66eec7e47adadf76f1dc", version = "=0.23.2", default-features = false, features = ["onig"] }

[profile.release]
panic = "unwind"
strip = "debuginfo"
