[package]
name = "winsight-segmenter"
version = "0.1.0"
edition = "2021"
publish = false
license = "Apache-2.0"

[lib]
name = "winsight_segmenter"
crate-type = ["cdylib", "rlib"]

[dependencies]
jieba-rs = "=0.11.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"

[profile.release]
panic = "unwind"
strip = "debuginfo"
