name: Windows source checks
"on": [push, pull_request]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check source layout and script syntax
        shell: bash
        run: python scripts/check-windows-source.py
      - name: Test Rust shell
        working-directory: shell/src-tauri
        run: cargo test --locked
